<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasos y Putasos</title>
    <link rel="icon" type="image/png" href="/public/Favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
</head>

<body>
    <!-- ================= PANTALLA 1: MENÚ PRINCIPAL (ESTÁTICO EN HTML) ================= -->
    <div class="game-screen active-screen" id="screen-start">
        <div class="screen-card start-card">
            <img src="/Title.svg" alt="Duelos de Acero" class="start-title-logo">
            <div class="start-menu-buttons">
                <button id="btn-mode-vs-ai">1P vs IA</button>
                <button id="btn-mode-local">1P vs 1P</button>
            </div>
            <div class="start-floating-logo-wrapper">
                <img src="/Game_logo_white.svg" alt="Logo Pasos y Putasos" class="start-floating-logo">
            </div>
        </div>
    </div>

    <!-- CONTENEDOR DINÁMICO PARA PANTALLAS DE JUEGO / GAME OVER EN JS -->
    <main id="app-dynamic-content"></main>

    <!-- Librerías locales de SFX -->
    <script src="/assets/audio/riffwave.js"></script>
    <script src="/assets/audio/sfxr.js"></script>
    <!-- Entrada principal de la aplicación -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
